services:
  - type: worker
    name: asox-telegram-bot
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      # --- Majburiy ---
      - key: BOT_TOKEN            # @AsoxUz_Bot tokeni (@BotFather)
        sync: false
      - key: ADMIN_IDS            # vergul bilan ajratilgan raqamli Telegram ID lar
        sync: false
      - key: SHOP_LINK_SECRET     # asox.uz backendidagi bilan BIR XIL bo'lishi shart
        sync: false

      # --- Admin bot (@asox_admin_bot). Berilmasa admin bot ishga tushmaydi ---
      - key: ADMIN_BOT_TOKEN
        sync: false

      # --- Firestore. Berilmasa bot xotiradagi namuna ma'lumotlar bilan ishlaydi ---
      # Service account JSON ni to'liq matn sifatida qo'ying (Render'da fayl yuklash noqulay).
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false

      - key: ENVIRONMENT
        value: production
